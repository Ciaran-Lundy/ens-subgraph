type Domain @entity(immutable: false) {
  "The namehash of the name"
  id: ID!
  "The human readable name, if known. Unknown portions replaced with hash in square brackets (eg, foo.[1234].eth)"
  name: String
  "The human readable label name (imported from CSV), if known"
  labelName: String
  "keccak256(labelName)"
  labelhash: Bytes
  "The namehash (id) of the parent name"
  parent: Domain
  "Can count domains from length of array"
  subdomains: [Domain!]! @derivedFrom(field: "parent")
  "The number of subdomains"
  subdomainCount: Int!
  "Address logged from current resolver, if any"
  resolvedAddress: Account

  "The resolver that controls the domain's settings"
  resolver: Resolver
  "The time-to-live (TTL) value of the domain's records"
  ttl: BigInt

  "Indicates whether the domain has been migrated to a new registrar"
  isMigrated: Boolean!
  "The time when the domain was created"
  createdAt: BigInt!

  "The account that owns the domain"
  owner: Account!
  "The account that owns the ERC721 NFT for the domain"
  registrant: Account
  "The account that owns the wrapped domain"
  wrappedOwner: Account

  "The expiry date for the domain, from either the registration, or the wrapped domain if PCC is burned"
  expiryDate: BigInt

  "The registration associated with the domain"
  registration: Registration @derivedFrom(field: "domain")
  "The wrapped domain associated with the domain"
  wrappedDomain: WrappedDomain @derivedFrom(field: "domain")

  "The events associated with the domain"
  events: [DomainEvent!]! @derivedFrom(field: "domain")
}

interface DomainEvent {
  "The unique identifier of the event"
  id: ID!
  "The domain name associated with the event"
  domain: Domain!
  "The block number at which the event occurred"
  blockNumber: Int!
  "The transaction hash of the transaction that triggered the event"
  transactionID: Bytes!
}

type Transfer implements DomainEvent @entity(immutable: true) {
  "The unique identifier of the event"
  id: ID!
  "The domain name associated with the event"
  domain: Domain!
  "The block number at which the event occurred"
  blockNumber: Int!
  "The transaction hash of the transaction that triggered the event"
  transactionID: Bytes!
  "The account that owns the domain after the transfer"
  owner: Account!
}

type NewOwner implements DomainEvent @entity(immutable: true) {
  "The unique identifier of the event"
  id: ID!
  "The parent domain of the domain name associated with the event"
  parentDomain: Domain!
  "The domain name associated with the event"
  domain: Domain!
  "The block number at which the event occurred"
  blockNumber: Int!
  "The transaction hash of the transaction that triggered the event"
  transactionID: Bytes!
  "The new account that owns the domain"
  owner: Account!
}

type NewResolver implements DomainEvent @entity(immutable: true) {
  "The unique identifier of the event"
  id: ID!
  "The domain name associated with the event"
  domain: Domain!
  "The block number at which the event occurred"
  blockNumber: Int!
  "The transaction hash of the transaction that triggered the event"
  transactionID: Bytes!
  "The new resolver contract address associated with the domain"
  resolver: Resolver!
}

type NewTTL implements DomainEvent @entity(immutable: true) {
  "The unique identifier of the event"
  id: ID!
  "The domain name associated with the event"
  domain: Domain!
  "The block number at which the event occurred"
  blockNumber: Int!
  "The transaction hash of the transaction that triggered the event"
  transactionID: Bytes!
  "The new TTL value (in seconds) associated with the domain"
  ttl: BigInt!
}

type WrappedTransfer implements DomainEvent @entity(immutable: true) {
  "The unique identifier of the event"
  id: ID!
  "The domain name associated with the event"
  domain: Domain!
  "The block number at which the event occurred"
  blockNumber: Int!
  "The transaction hash of the transaction that triggered the event"
  transactionID: Bytes!
  "The account that owns the wrapped domain after the transfer"
  owner: Account!
}

type NameWrapped implements DomainEvent @entity(immutable: true) {
  "The unique identifier of the wrapped domain"
  id: ID!
  "The domain name associated with the wrapped domain"
  domain: Domain!
  "The block number at which the wrapped domain was wrapped"
  blockNumber: Int!
  "The transaction hash of the transaction that wrapped the domain"
  transactionID: Bytes!
  "The human-readable name of the wrapped domain"
  name: String
  "The number of fuses associated with the wrapped domain"
  fuses: Int!
  "The account that owns the wrapped domain"
  owner: Account!
  "The expiry date of the wrapped domain registration"
  expiryDate: BigInt!
}

type NameUnwrapped implements DomainEvent @entity(immutable: true) {
  "The unique identifier of the event"
  id: ID!
  "The domain name associated with the event"
  domain: Domain!
  "The block number at which the event occurred"
  blockNumber: Int!
  "The transaction hash of the transaction that triggered the event"
  transactionID: Bytes!
  "The account that owns the domain after it was unwrapped"
  owner: Account!
}

type FusesSet implements DomainEvent @entity(immutable: true) {
  "The unique identifier of the event"
  id: ID!
  "The domain name associated with the event"
  domain: Domain!
  "The block number at which the event occurred"
  blockNumber: Int!
  "The transaction hash of the transaction that triggered the event"
  transactionID: Bytes!
  "The number of fuses associated with the domain after the set event"
  fuses: Int!
}

type ExpiryExtended implements DomainEvent @entity(immutable: true) {
  "The unique identifier of the event"
  id: ID!
  "The domain name associated with the event"
  domain: Domain!
  "The block number at which the event occurred"
  blockNumber: Int!
  "The transaction hash of the transaction that triggered the event"
  transactionID: Bytes!
  "The new expiry date associated with the domain after the extension event"
  expiryDate: BigInt!
}

type Registration @entity(immutable: false) {
  "The unique identifier of the registration"
  id: ID!
  "The domain name associated with the registration"
  domain: Domain!
  "The registration date of the domain"
  registrationDate: BigInt!
  "The expiry date of the domain"
  expiryDate: BigInt!
  "The cost associated with the domain registration"
  cost: BigInt
  "The account that registered the domain"
  registrant: Account!
  "The human-readable label name associated with the domain registration"
  labelName: String
  "The events associated with the domain registration"
  events: [RegistrationEvent!]! @derivedFrom(field: "registration")
}

interface RegistrationEvent {
  "The unique identifier of the registration event"
  id: ID!
  "The registration associated with the event"
  registration: Registration!
  "The block number of the event"
  blockNumber: Int!
  "The transaction ID associated with the event"
  transactionID: Bytes!
}

type NameRegistered implements RegistrationEvent @entity(immutable: true) {
  "The unique identifier of the NameRegistered event"
  id: ID!
  "The registration associated with the event"
  registration: Registration!
  "The block number of the event"
  blockNumber: Int!
  "The transaction ID associated with the event"
  transactionID: Bytes!
  "The account that registered the name"
  registrant: Account!
  "The expiry date of the registration"
  expiryDate: BigInt!
}

type NameRenewed implements RegistrationEvent @entity(immutable: true) {
  "The unique identifier of the NameRenewed event"
  id: ID!
  "The registration associated with the event"
  registration: Registration!
  "The block number of the event"
  blockNumber: Int!
  "The transaction ID associated with the event"
  transactionID: Bytes!
  "The new expiry date of the registration"
  expiryDate: BigInt!
}

type NameTransferred implements RegistrationEvent @entity(immutable: true) {
  "The ID of the event"
  id: ID!
  "The registration associated with the event"
  registration: Registration!
  "The block number of the event"
  blockNumber: Int!
  "The transaction ID of the event"
  transactionID: Bytes!
  "The new owner of the domain"
  newOwner: Account!
}

type WrappedDomain @entity(immutable: false) {
  "unique identifier for each instance of the WrappedDomain entity"
  id: ID!
  "The domain that is wrapped by this WrappedDomain"
  domain: Domain!
  "The expiry date of the wrapped domain"
  expiryDate: BigInt!
  "The number of fuses remaining on the wrapped domain"
  fuses: Int!
  "The account that owns this WrappedDomain"
  owner: Account!
  "The name of the wrapped domain"
  name: String
}

type Account @entity(immutable: false) {
  "The unique identifier for the account"
  id: ID!
  "The domains owned by the account"
  domains: [Domain!]! @derivedFrom(field: "owner")
  "The WrappedDomains owned by the account"
  wrappedDomains: [WrappedDomain!] @derivedFrom(field: "owner")
  "The Registrations made by the account"
  registrations: [Registration!] @derivedFrom(field: "registrant")
}

extend type Account {
  ensv2Slots: [ENSv2NameSlot!]! @derivedFrom(field: "owner")
  ensv2Tokens: [ENSv2Token!]! @derivedFrom(field: "owner")
  ensv2Registrations: [ENSv2Registration!]! @derivedFrom(field: "owner")
}

type Resolver @entity(immutable: false) {
  "The unique identifier for this resolver, which is a concatenation of the resolver address and the domain namehash"
  id: ID!
  "The domain that this resolver is associated with"
  domain: Domain
  "The address of the resolver contract"
  address: Bytes!
  "The current value of the 'addr' record for this resolver, as determined by the associated events"
  addr: Account
  "The content hash for this resolver, in binary format"
  contentHash: Bytes
  "The set of observed text record keys for this resolver"
  texts: [String!]
  "The set of observed SLIP-44 coin types for this resolver"
  coinTypes: [BigInt!]
  "The events associated with this resolver"
  events: [ResolverEvent!]! @derivedFrom(field: "resolver")
}

interface ResolverEvent {
  "Concatenation of block number and log ID"
  id: ID!
  "Used to derive relationships to Resolvers"
  resolver: Resolver!
  "The block number that the event occurred on"
  blockNumber: Int!
  "The transaction hash of the event"
  transactionID: Bytes!
}

type AddrChanged implements ResolverEvent @entity(immutable: true) {
  "Unique identifier for this event"
  id: ID!
  "The resolver associated with this event"
  resolver: Resolver!
  "The block number at which this event occurred"
  blockNumber: Int!
  "The transaction ID for the transaction in which this event occurred"
  transactionID: Bytes!
  "The new address associated with the resolver"
  addr: Account!
}

type MulticoinAddrChanged implements ResolverEvent @entity(immutable: true) {
  "Unique identifier for the event"
  id: ID!
  "Resolver associated with this event"
  resolver: Resolver!
  "Block number in which this event was emitted"
  blockNumber: Int!
  "Transaction ID in which this event was emitted"
  transactionID: Bytes!
  "The coin type of the changed address"
  coinType: BigInt!
  "The new address value for the given coin type"
  addr: Bytes!
}

type NameChanged implements ResolverEvent @entity(immutable: true) {
  "Concatenation of block number and log ID"
  id: ID!
  "Used to derive relationships to Resolvers"
  resolver: Resolver!
  "Block number where event occurred"
  blockNumber: Int!
  "Unique transaction ID where event occurred"
  transactionID: Bytes!
  "New ENS name value"
  name: String!
}

type AbiChanged implements ResolverEvent @entity(immutable: true) {
  "Concatenation of block number and log ID"
  id: ID!
  "Used to derive relationships to Resolvers"
  resolver: Resolver!
  "The block number at which the event was emitted"
  blockNumber: Int!
  "The transaction hash of the transaction in which the event was emitted"
  transactionID: Bytes!
  "The content type of the ABI change"
  contentType: BigInt!
}

type PubkeyChanged implements ResolverEvent @entity(immutable: true) {
  "Concatenation of block number and log ID"
  id: ID!
  "Used to derive relationships to Resolvers"
  resolver: Resolver!
  "Block number of the Ethereum block where the event occurred"
  blockNumber: Int!
  "Transaction hash of the Ethereum transaction where the event occurred"
  transactionID: Bytes!
  "The x-coordinate of the new public key"
  x: Bytes!
  "The y-coordinate of the new public key"
  y: Bytes!
}

type TextChanged implements ResolverEvent @entity(immutable: true) {
  "Concatenation of block number and log ID"
  id: ID!
  "Used to derive relationships to Resolvers"
  resolver: Resolver!
  "Block number of the Ethereum block in which the event occurred"
  blockNumber: Int!
  "Hash of the Ethereum transaction in which the event occurred"
  transactionID: Bytes!
  "The key of the text record that was changed"
  key: String!
  "The new value of the text record that was changed"
  value: String
}

type ContenthashChanged implements ResolverEvent @entity(immutable: true) {
  "Concatenation of block number and log ID"
  id: ID!
  "Used to derive relationships to Resolvers"
  resolver: Resolver!
  "The block number where the event occurred"
  blockNumber: Int!
  "The ID of the transaction where the event occurred"
  transactionID: Bytes!
  "The new content hash for the domain"
  hash: Bytes!
}

type InterfaceChanged implements ResolverEvent @entity(immutable: true) {
  "Concatenation of block number and log ID"
  id: ID!
  "Used to derive relationships to Resolvers"
  resolver: Resolver!
  "The block number in which the event occurred"
  blockNumber: Int!
  "The transaction ID for the transaction in which the event occurred"
  transactionID: Bytes!
  "The ID of the EIP-1820 interface that was changed"
  interfaceID: Bytes!
  "The address of the contract that implements the interface"
  implementer: Bytes!
}

type AuthorisationChanged implements ResolverEvent @entity(immutable: true) {
  "Unique identifier for this event"
  id: ID!
  "The resolver associated with this event"
  resolver: Resolver!
  "The block number at which the event occurred"
  blockNumber: Int!
  "The transaction hash associated with the event"
  transactionID: Bytes!
  "The owner of the authorisation"
  owner: Bytes!
  "The target of the authorisation"
  target: Bytes!
  "Whether the authorisation was added or removed"
  isAuthorized: Boolean!
}

type VersionChanged implements ResolverEvent @entity(immutable: true) {
  "Unique identifier for this event"
  id: ID!
  "The resolver associated with this event"
  resolver: Resolver!
  "The block number at which the event occurred"
  blockNumber: Int!
  "The transaction hash associated with the event"
  transactionID: Bytes!
  "The new version number of the resolver"
  version: BigInt!
}

# ---------------------------------------------------------------------------
# ENSv2 — additive schema per docs/plan.md / ENSv2 Subgraph Upgrade Proposal.
# ENSv2-native entities are the source of truth for registries, namespaces,
# slots, tokens, resources, and linked paths. Domain (above) and
# ENSv2NamePath remain materialised projections — see docs/plan.md's
# "Approach" section for the late-link/bounded-cost projection rule.
# ---------------------------------------------------------------------------

enum ENSv2RegistryKind {
  ROOT
  ETH
  USER
  WRAPPER
  REVERSE
  UNKNOWN
}

enum ENSv2NameSlotStatus {
  AVAILABLE
  RESERVED
  REGISTERED
}

type ENSv2Registry @entity(immutable: false) {
  id: ID! # registry address
  address: Bytes!
  kind: ENSv2RegistryKind!
  canonicalParentRegistry: ENSv2Registry
  canonicalParentLabel: String
  namespaces: [ENSv2Namespace!]! @derivedFrom(field: "registry")
  namespaceCount: Int!
  discoveredAt: BigInt!
  createdAtBlock: BigInt!
  updatedAtBlock: BigInt!
}

type ENSv2NameSlot @entity(immutable: false) {
  id: ID! # registry-address + slotId
  registry: ENSv2Registry!
  slotId: BigInt!
  labelhash: Bytes!
  label: String
  currentResource: ENSv2Resource
  currentToken: ENSv2Token
  owner: Account
  registrant: Account
  resolverAddress: Bytes
  resolver: ENSv2Resolver
  subregistryAddress: Bytes
  subregistry: ENSv2Registry
  status: ENSv2NameSlotStatus!
  expiryDate: BigInt
  pathCount: Int!
  migratedFromV1: Boolean! # true if the current registration's sender was a migration controller
  resources: [ENSv2Resource!]! @derivedFrom(field: "slot")
  paths: [ENSv2NamePath!]! @derivedFrom(field: "slot")
  events: [ENSv2NameSlotEvent!]! @derivedFrom(field: "slot")
  createdAt: BigInt!
  updatedAt: BigInt!
  createdAtBlock: BigInt!
  updatedAtBlock: BigInt!
}

type ENSv2Resource @entity(immutable: false) {
  id: ID! # registry-address + resource
  registry: ENSv2Registry!
  slot: ENSv2NameSlot!
  resource: BigInt!
  currentToken: ENSv2Token
  active: Boolean!
  createdAt: BigInt!
  endedAt: BigInt
  createdAtBlock: BigInt!
  updatedAtBlock: BigInt!
}

type ENSv2Token @entity(immutable: false) {
  id: ID! # registry-address + tokenId
  registry: ENSv2Registry!
  slot: ENSv2NameSlot
  resource: BigInt
  resourceEntity: ENSv2Resource
  tokenId: BigInt!
  owner: Account
  active: Boolean!
  createdAtBlock: BigInt!
  updatedAtBlock: BigInt!
}

type ENSv2NamePath @entity(immutable: false) {
  id: ID! # namehash hex
  slot: ENSv2NameSlot!
  registry: ENSv2Registry! # registry that owns this label slot
  namespace: ENSv2Namespace!
  parent: ENSv2NamePath
  label: String
  labelhash: Bytes!
  name: String
  namehash: Bytes!
  depth: Int!
  domain: Domain # compatibility projection, nullable by design
  active: Boolean!
  namespaceCount: Int! # needed to enumerate ENSv2PathNamespaceIndex
  createdAt: BigInt!
  updatedAt: BigInt!
  createdAtBlock: BigInt!
  updatedAtBlock: BigInt!
}

type ENSv2Namespace @entity(immutable: false) {
  id: ID! # registry + baseNamehash
  registry: ENSv2Registry! # registry serving this namespace
  parentPath: ENSv2NamePath # e.g. base.eth for the registry serving *.base.eth
  parentSlot: ENSv2NameSlot
  parentRegistry: ENSv2Registry
  parentSlotId: BigInt
  parentTokenId: BigInt
  parentResource: BigInt
  baseName: String
  baseNamehash: Bytes!
  active: Boolean!
  createdAt: BigInt!
  createdAtBlock: BigInt!
  updatedAtBlock: BigInt!
  transactionID: Bytes
  logIndex: BigInt
}

type ENSv2NamespaceLink @entity(immutable: false) {
  id: ID! # parent registry + parent slot + child address + activation log
  parentRegistry: ENSv2Registry!
  parentSlot: ENSv2NameSlot
  parentSlotId: BigInt!
  parentTokenId: BigInt
  parentResource: BigInt
  childRegistryAddress: Bytes!
  childRegistry: ENSv2Registry
  active: Boolean!
  transactionID: Bytes!
  blockNumber: BigInt!
  logIndex: BigInt!
}

type ENSv2Resolver @entity(immutable: false) {
  id: ID! # resolver address
  address: Bytes!
  slots: [ENSv2NameSlot!]! @derivedFrom(field: "resolver")
}

type ENSv2RoleAssignment @entity(immutable: false) {
  id: ID! # contract-address + resource + account
  contract: Bytes!
  resource: BigInt!
  resourceEntity: ENSv2Resource
  account: Account!
  roleBitmap: BigInt!
  updatedAtBlock: BigInt!
}

type ENSv2RoleChange @entity(immutable: true) {
  id: ID!
  contract: Bytes!
  resource: BigInt!
  account: Account!
  oldRoleBitmap: BigInt!
  newRoleBitmap: BigInt!
  blockNumber: BigInt!
  transactionID: Bytes!
  logIndex: BigInt!
}

interface ENSv2NameSlotEvent {
  id: ID!
  slot: ENSv2NameSlot!
  blockNumber: BigInt!
  transactionID: Bytes!
  logIndex: BigInt!
}

type ENSv2LabelRegistered implements ENSv2NameSlotEvent @entity(immutable: true) {
  id: ID! # transactionID-logIndex
  slot: ENSv2NameSlot!
  blockNumber: BigInt!
  transactionID: Bytes!
  logIndex: BigInt!
  owner: Account!
  expiryDate: BigInt!
  isReRegistration: Boolean!
  sender: Bytes! # event.params.sender, the actual caller of register()
  isV1Migration: Boolean! # true if sender matches a known migration controller address
}

type ENSv2LabelRenewed implements ENSv2NameSlotEvent @entity(immutable: true) {
  id: ID!
  slot: ENSv2NameSlot!
  blockNumber: BigInt!
  transactionID: Bytes!
  logIndex: BigInt!
  newExpiryDate: BigInt!
}

type ENSv2LabelUnregistered implements ENSv2NameSlotEvent @entity(immutable: true) {
  id: ID!
  slot: ENSv2NameSlot!
  blockNumber: BigInt!
  transactionID: Bytes!
  logIndex: BigInt!
  sender: Bytes!
}

type ENSv2TokenTransferred implements ENSv2NameSlotEvent @entity(immutable: true) {
  id: ID!
  slot: ENSv2NameSlot!
  blockNumber: BigInt!
  transactionID: Bytes!
  logIndex: BigInt!
  from: Account!
  to: Account!
  tokenId: BigInt!
}

type ENSv2TokenRegenerated implements ENSv2NameSlotEvent @entity(immutable: true) {
  id: ID!
  slot: ENSv2NameSlot!
  blockNumber: BigInt!
  transactionID: Bytes!
  logIndex: BigInt!
  oldTokenId: BigInt!
  newTokenId: BigInt!
}

type ENSv2ResolverUpdate implements ENSv2NameSlotEvent @entity(immutable: true) {
  id: ID!
  slot: ENSv2NameSlot!
  blockNumber: BigInt!
  transactionID: Bytes!
  logIndex: BigInt!
  resolverAddress: Bytes # null means setResolver(..., address(0))
  sender: Bytes!
}

type ENSv2SubregistryUpdate implements ENSv2NameSlotEvent @entity(immutable: true) {
  id: ID!
  slot: ENSv2NameSlot!
  blockNumber: BigInt!
  transactionID: Bytes!
  logIndex: BigInt!
  subregistryAddress: Bytes # null means setSubregistry(..., address(0))
  sender: Bytes!
}

type ENSv2Registration @entity(immutable: false) {
  id: ID! # registrar tx/log or registry + resource
  slot: ENSv2NameSlot!
  resource: ENSv2Resource
  path: ENSv2NamePath
  label: String
  owner: Account
  duration: BigInt
  paymentToken: Bytes
  referrer: Bytes
  base: BigInt
  premium: BigInt
  registrationDate: BigInt!
  expiryDate: BigInt
  transactionID: Bytes!
  logIndex: BigInt!
}

# `ENSv2ResolverAlias` stores resolver level alias rules.
# These rules affect effective resolution, but they do not mutate the legacy `Resolver` row for the source node.
type ENSv2ResolverAlias @entity(immutable: false) {
  id: ID! # resolver + fromName bytes
  resolver: ENSv2Resolver!
  fromName: Bytes!
  toName: Bytes
  fromNode: Bytes!
  toNode: Bytes
  fromNameDecoded: String
  toNameDecoded: String
  active: Boolean!
  blockNumber: BigInt!
  transactionID: Bytes!
  logIndex: BigInt!
}

type ENSv2ResolverResource @entity(immutable: false) {
  id: ID! # resolver + resource + optional part type/key
  resolver: ENSv2Resolver!
  resource: BigInt! # resolver-side resource, not the same ID space as ENSv2Resource.resource
  node: Bytes!
  name: Bytes!
  nameDecoded: String
  kind: String! # NAME, TEXT, DATA, ADDR
  key: String
  keyHash: Bytes
  coinType: BigInt
  active: Boolean!
  blockNumber: BigInt!
  transactionID: Bytes!
  logIndex: BigInt!
}

type ENSv2ResolverData @entity(immutable: false) {
  id: ID! # resolver + node + key
  resolver: ENSv2Resolver!
  node: Bytes!
  key: String!
  value: Bytes
  blockNumber: BigInt!
  transactionID: Bytes!
  logIndex: BigInt!
}

type ENSv2RegistryNamespaceIndex @entity(immutable: false) {
  id: ID! # registry + index
  registry: ENSv2Registry!
  index: Int!
  namespace: ENSv2Namespace!
}

type ENSv2SlotPathIndex @entity(immutable: false) {
  id: ID! # slot + index
  slot: ENSv2NameSlot!
  index: Int!
  path: ENSv2NamePath!
}

type ENSv2PathNamespaceIndex @entity(immutable: false) {
  id: ID! # path + index
  path: ENSv2NamePath!
  index: Int!
  namespace: ENSv2Namespace!
}
