specVersion: 0.0.4
description: >-
  A secure & decentralized way to address resources on and off the blockchain
  using simple, human-readable names. Access domains and transfer history.
repository: "https://github.com/ensdomains/ens-subgraph"
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: ENSRegistry
    network: mainnet
    source:
      address: "0x00000000000C2E074eC69A0dFb2997BA6C7d2e1e"
      abi: EnsRegistry
      startBlock: 9380380
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: ./src/ensRegistry.ts
      entities:
        - Domain
        - Account
        - Resolver
        - OperatorApproval
      abis:
        - name: EnsRegistry
          file: ./abis/Registry.json
      eventHandlers:
        - event: "Transfer(indexed bytes32,address)"
          handler: handleTransfer
        - event: "NewOwner(indexed bytes32,indexed bytes32,address)"
          handler: handleNewOwner
        - event: "NewResolver(indexed bytes32,address)"
          handler: handleNewResolver
        - event: "NewTTL(indexed bytes32,uint64)"
          handler: handleNewTTL
        - event: "ApprovalForAll(indexed address,indexed address,bool)"
          handler: handleApprovalForAll

  - kind: ethereum/contract
    name: ENSRegistryOld
    network: mainnet
    source:
      address: "0x314159265dd8dbb310642f98f50c066173c1259b"
      abi: EnsRegistry
      startBlock: 3327417
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: ./src/ensRegistry.ts
      entities:
        - Domain
        - Account
        - Resolver
        - OperatorApproval
      abis:
        - name: EnsRegistry
          file: ./abis/Registry.json
      eventHandlers:
        - event: "Transfer(indexed bytes32,address)"
          handler: handleTransferOldRegistry
        - event: "NewOwner(indexed bytes32,indexed bytes32,address)"
          handler: handleNewOwnerOldRegistry
        - event: "NewResolver(indexed bytes32,address)"
          handler: handleNewResolverOldRegistry
        - event: "NewTTL(indexed bytes32,uint64)"
          handler: handleNewTTLOldRegistry
        - event: "ApprovalForAll(indexed address,indexed address,bool)"
          handler: handleApprovalForAllOldRegistry

  - kind: ethereum/contract
    name: Resolver
    network: mainnet
    source:
      abi: Resolver
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: ./src/resolver.ts
      entities:
        - AddrChanged
        - MulticoinAddrChanged
        - NameChanged
        - AbiChanged
        - PubkeyChanged
        - Textchanged
        - ContenthashChanged
        - InterfaceChanged
        - AuthorisationChanged
      abis:
        - name: Resolver
          file: ./abis/PublicResolver.json
      eventHandlers:
        - event: "ABIChanged(indexed bytes32,indexed uint256)"
          handler: handleABIChanged
        - event: "AddrChanged(indexed bytes32,address)"
          handler: handleAddrChanged
        - event: "AddressChanged(indexed bytes32,uint256,bytes)"
          handler: handleMulticoinAddrChanged
        - event: >-
            AuthorisationChanged(indexed bytes32,indexed address,indexed
            address,bool)
          handler: handleAuthorisationChanged
        - event: "ContenthashChanged(indexed bytes32,bytes)"
          handler: handleContentHashChanged
        - event: "InterfaceChanged(indexed bytes32,indexed bytes4,address)"
          handler: handleInterfaceChanged
        - event: "NameChanged(indexed bytes32,string)"
          handler: handleNameChanged
        - event: "PubkeyChanged(indexed bytes32,bytes32,bytes32)"
          handler: handlePubkeyChanged
        - event: "TextChanged(indexed bytes32,indexed string,string)"
          handler: handleTextChanged
        - event: "TextChanged(indexed bytes32,indexed string,string,string)"
          handler: handleTextChangedWithValue
        - event: "VersionChanged(indexed bytes32,uint64)"
          handler: handleVersionChanged

  - kind: ethereum/contract
    name: BaseRegistrar
    network: mainnet
    source:
      address: "0x57f1887a8BF19b14fC0dF6Fd9B2acc9Af147eA85"
      abi: BaseRegistrar
      startBlock: 9380410
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: ./src/ethRegistrar.ts
      entities:
        - Registration
        - NameRegistered
        - NameRenewed
        - NameTransferred
        - OperatorApproval
        - ContractOwnership
        - RegistrarController
      abis:
        - name: BaseRegistrar
          file: ./abis/BaseRegistrar.json
      eventHandlers:
        - event: "NameRegistered(indexed uint256,indexed address,uint256)"
          handler: handleNameRegistered
        - event: "NameRenewed(indexed uint256,uint256)"
          handler: handleNameRenewed
        - event: "Transfer(indexed address,indexed address,indexed uint256)"
          handler: handleNameTransferred
        - event: "ApprovalForAll(indexed address,indexed address,bool)"
          handler: handleBaseRegistrarApprovalForAll
        - event: "OwnershipTransferred(indexed address,indexed address)"
          handler: handleBaseRegistrarOwnershipTransferred
        - event: "ControllerAdded(indexed address)"
          handler: handleControllerAdded
        - event: "ControllerRemoved(indexed address)"
          handler: handleControllerRemoved

  - kind: ethereum/contract
    name: LegacyEthRegistrarController
    network: mainnet
    source:
      address: "0x283Af0B28c62C092C9727F1Ee09c02CA627EB7F5"
      abi: LegacyEthRegistrarController
      startBlock: 9380471
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: ./src/ethRegistrar.ts
      entities:
        - Registration
        - ContractOwnership
      abis:
        - name: LegacyEthRegistrarController
          file: ./abis/LegacyEthRegistrarController.json
      eventHandlers:
        - event: >-
            NameRegistered(string,indexed bytes32,indexed
            address,uint256,uint256)
          handler: handleNameRegisteredByLegacyController
        - event: "NameRenewed(string,indexed bytes32,uint256,uint256)"
          handler: handleNameRenewedByLegacyController
        - event: "OwnershipTransferred(indexed address,indexed address)"
          handler: handleLegacyControllerOwnershipTransferred

  - kind: ethereum/contract
    name: WrappedEthRegistrarController
    network: mainnet
    source:
      address: "0x253553366Da8546fC250F225fe3d25d0C782303b"
      abi: WrappedEthRegistrarController
      startBlock: 16925618
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: ./src/ethRegistrar.ts
      entities:
        - Registration
        - ContractOwnership
      abis:
        - name: WrappedEthRegistrarController
          file: ./abis/WrappedEthRegistrarController.json
      eventHandlers:
        - event: >-
            NameRegistered(string,indexed bytes32,indexed
            address,uint256,uint256,uint256)
          handler: handleNameRegisteredByWrappedController
        - event: "NameRenewed(string,indexed bytes32,uint256,uint256)"
          handler: handleNameRenewedByLegacyController
        - event: "OwnershipTransferred(indexed address,indexed address)"
          handler: handleWrappedControllerOwnershipTransferred

  - kind: ethereum/contract
    name: NameWrapper
    network: mainnet
    source:
      address: "0xD4416b13d2b3a9aBae7AcD5D6C2BbDBE25686401"
      abi: NameWrapper
      startBlock: 16925608
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: ./src/nameWrapper.ts
      entities:
        - NameWrapper
        - OperatorApproval
        - ContractOwnership
        - RegistrarController
      abis:
        - name: NameWrapper
          file: ./abis/NameWrapper.json
      eventHandlers:
        - event: "NameWrapped(indexed bytes32,bytes,address,uint32,uint64)"
          handler: handleNameWrapped
        - event: "NameUnwrapped(indexed bytes32,address)"
          handler: handleNameUnwrapped
        - event: "FusesSet(indexed bytes32,uint32)"
          handler: handleFusesSet
        - event: "ExpiryExtended(indexed bytes32,uint64)"
          handler: handleExpiryExtended
        - event: TransferSingle(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleTransferSingle
        - event: TransferBatch(indexed address,indexed address,indexed address,uint256[],uint256[])
          handler: handleTransferBatch
        - event: "ApprovalForAll(indexed address,indexed address,bool)"
          handler: handleNameWrapperApprovalForAll
        - event: "OwnershipTransferred(indexed address,indexed address)"
          handler: handleNameWrapperOwnershipTransferred
        - event: "ControllerChanged(indexed address,bool)"
          handler: handleControllerChanged

  - kind: ethereum/contract
    name: UnwrappedEthRegistrarController
    network: mainnet
    source:
      address: "0x59E16fcCd424Cc24e280Be16E11Bcd56fb0CE547"
      abi: UnwrappedEthRegistrarController
      startBlock: 22764821
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: ./src/ethRegistrar.ts
      entities:
        - Registration
        - ContractOwnership
      abis:
        - name: UnwrappedEthRegistrarController
          file: ./abis/UnwrappedEthRegistrarController.json
      eventHandlers:
        - event: >-
            NameRegistered(string,indexed bytes32,indexed
            address,uint256,uint256,uint256,bytes32)
          handler: handleNameRegisteredByUnwrappedController
        - event: "NameRenewed(string,indexed bytes32,uint256,uint256,bytes32)"
          handler: handleNameRenewedByUnwrappedController
        - event: "OwnershipTransferred(indexed address,indexed address)"
          handler: handleUnwrappedControllerOwnershipTransferred

  # ---------------------------------------------------------------------
  # ENSv2 — additive data sources per docs/plan.md Phase 1.
  # `address` fields below are Sepolia addresses used as the manifest
  # default since no mainnet ENSv2 deployment exists yet (`network: mainnet`
  # is kept for consistency — a subgraph can't mix networks). Real target
  # network is Sepolia via `yarn deploy:sepolia`, which swaps
  # address/network from networks.json's `sepolia` block.
  # ---------------------------------------------------------------------

  - kind: ethereum/contract
    name: RootRegistry
    network: mainnet
    source:
      address: "0xc960F7217d3643B525Ef36Bec8Adf86953CD9aB8"
      abi: PermissionedRegistry
      startBlock: 11465480
    # Anchored — RootRegistry, ETHRegistry, and the ENSv2Registry template
    # below all bind the same PermissionedRegistry contract type and share
    # this exact mapping (audit finding 14: this was previously duplicated
    # ~50 lines x3, an easy spot for the three copies to drift).
    mapping: &ensv2RegistryMapping
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: ./src/ensv2Registry.ts
      entities:
        - ENSv2Registry
        - ENSv2NameSlot
        - ENSv2Namespace
        - ENSv2NamespaceLink
        - ENSv2Resource
        - ENSv2Token
        - ENSv2NamePath
        - ENSv2RoleAssignment
        - ENSv2RoleChange
        - ENSv2LabelRegistered
        - ENSv2LabelRenewed
        - ENSv2LabelUnregistered
        - ENSv2TokenTransferred
        - ENSv2TokenRegenerated
        - ENSv2ResolverUpdate
        - ENSv2SubregistryUpdate
        - OperatorApproval
      abis:
        - name: PermissionedRegistry
          file: ./abis/PermissionedRegistry.json
      eventHandlers:
        - event: "LabelRegistered(indexed uint256,indexed bytes32,string,address,uint64,indexed address)"
          handler: handleLabelRegistered
        - event: "LabelReserved(indexed uint256,indexed bytes32,string,uint64,indexed address)"
          handler: handleLabelReserved
        - event: "LabelUnregistered(indexed uint256,indexed address)"
          handler: handleLabelUnregistered
        - event: "ExpiryUpdated(indexed uint256,indexed uint64,indexed address)"
          handler: handleExpiryUpdated
        - event: "SubregistryUpdated(indexed uint256,indexed address,indexed address)"
          handler: handleSubregistryUpdated
        - event: "ResolverUpdated(indexed uint256,indexed address,indexed address)"
          handler: handleResolverUpdated
        - event: "TokenResource(indexed uint256,indexed uint256)"
          handler: handleTokenResource
        - event: "TokenRegenerated(indexed uint256,indexed uint256)"
          handler: handleTokenRegenerated
        - event: "TransferSingle(indexed address,indexed address,indexed address,uint256,uint256)"
          handler: handleTransferSingle
        - event: "TransferBatch(indexed address,indexed address,indexed address,uint256[],uint256[])"
          handler: handleTransferBatch
        - event: "ParentUpdated(indexed address,string,indexed address)"
          handler: handleParentUpdated
        - event: "EACRolesChanged(indexed uint256,indexed address,uint256,uint256)"
          handler: handleEACRolesChanged
        - event: "ApprovalForAll(indexed address,indexed address,bool)"
          handler: handleENSv2ApprovalForAll

  - kind: ethereum/contract
    name: ETHRegistry
    network: mainnet
    source:
      address: "0xDEDB92913A25abE1f7BCDD85D8A344a43B398B67"
      abi: PermissionedRegistry
      startBlock: 11465480
    mapping: *ensv2RegistryMapping

  - kind: ethereum/contract
    name: ETHRegistrar
    network: mainnet
    source:
      address: "0x8c2E866B439358c41AE05De9cbE8A00BFEFafFcA"
      abi: ETHRegistrar
      startBlock: 11479218
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: ./src/ensv2Registrar.ts
      entities:
        - ENSv2Registration
        - ContractOwnership
      abis:
        - name: ETHRegistrar
          file: ./abis/ETHRegistrar.json
      eventHandlers:
        - event: "NameRegistered(indexed uint256,string,address,address,address,uint64,address,indexed bytes32,uint256,uint256)"
          handler: handleNameRegistered
        - event: "NameRenewed(indexed uint256,string,uint64,uint64,address,indexed bytes32,uint256)"
          handler: handleNameRenewed
        - event: "OwnershipTransferred(indexed address,indexed address)"
          handler: handleETHRegistrarOwnershipTransferred

  - kind: ethereum/contract
    name: VerifiableFactory
    network: mainnet
    source:
      address: "0xD2a632D8a8b67c2c4398c255CbD7aF8dd7236198"
      abi: VerifiableFactory
      startBlock: 11465480
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: ./src/ensv2Discovery.ts
      entities:
        - ENSv2Registry
      abis:
        - name: VerifiableFactory
          file: ./abis/VerifiableFactory.json
      eventHandlers:
        - event: "ProxyDeployed(indexed address,indexed address,uint256,address)"
          handler: handleProxyDeployed

  - kind: ethereum/contract
    name: PermissionedResolver
    network: mainnet
    source:
      abi: PermissionedResolver
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: ./src/ensv2Resolver.ts
      entities:
        - ENSv2ResolverAlias
        - ENSv2ResolverResource
        - ENSv2ResolverData
        - ENSv2RoleAssignment
        - ENSv2RoleChange
      abis:
        - name: PermissionedResolver
          file: ./abis/PermissionedResolver.json
      eventHandlers:
        - event: "AliasChanged(indexed bytes,indexed bytes,bytes,bytes)"
          handler: handleAliasChanged
        - event: "NamedResource(indexed uint256,bytes)"
          handler: handleNamedResource
        - event: "NamedTextResource(indexed uint256,bytes,indexed bytes32,string)"
          handler: handleNamedTextResource
        - event: "NamedDataResource(indexed uint256,bytes,indexed bytes32,string)"
          handler: handleNamedDataResource
        - event: "NamedAddrResource(indexed uint256,bytes,indexed uint256)"
          handler: handleNamedAddrResource
        - event: "DataChanged(indexed bytes32,indexed string,string,indexed bytes)"
          handler: handleDataChanged
        - event: "EACRolesChanged(indexed uint256,indexed address,uint256,uint256)"
          handler: handleEACRolesChanged

templates:
  - kind: ethereum/contract
    name: ENSv2Registry
    network: mainnet
    source:
      abi: PermissionedRegistry
    mapping: *ensv2RegistryMapping
